# Mantém o Supabase (plano gratuito) acordado: o projeto pausa após 7 dias sem uso.
# Roda às segundas e quintas, 9h de Brasília, e faz uma consulta leve no banco.
name: Supabase acordado

on:
  schedule:
    - cron: "17 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          URL: https://hjpbvfcmhuhhpwvlhewv.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqcGJ2ZmNtaHVoaHB3dmxoZXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Mjc2MjgsImV4cCI6MjEwMDIwMzYyOH0.hr2s_L6m476s6zaR67rGsdl1mJoaPidRmrD6a1AMk2o
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/habits?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Resposta do Supabase: $code"
          if [ "$code" != "200" ]; then
            echo "O Supabase não respondeu 200. Ele pode estar pausado: abra o painel e clique em Resume project."
            exit 1
          fi
